services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: firsat_radari
      POSTGRES_USER: firsat
      POSTGRES_PASSWORD: firsat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firsat -d firsat_radari"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

