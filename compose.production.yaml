services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: firsat_radari
      POSTGRES_USER: firsat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firsat -d firsat_radari"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${FIRSAT_ENV_FILE:-.env.production}
    environment:
      FIRSAT_DATABASE_URL: postgresql+psycopg://firsat:${POSTGRES_PASSWORD}@postgres:5432/firsat_radari
      FIRSAT_RAW_STORAGE_PATH: /data/raw
    volumes:
      - raw_data:/data/raw
    command:
      - sh
      - -c
      - alembic upgrade head && python -m uvicorn firsat_radari.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${FIRSAT_ENV_FILE:-.env.production}
    environment:
      FIRSAT_DATABASE_URL: postgresql+psycopg://firsat:${POSTGRES_PASSWORD}@postgres:5432/firsat_radari
      FIRSAT_RAW_STORAGE_PATH: /data/raw
    volumes:
      - raw_data:/data/raw
    command: ["python", "scripts/run_scheduler_worker.py"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIRSAT_API_URL: /api
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      FIRSAT_DOMAIN: ${FIRSAT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  raw_data:
  caddy_data:
  caddy_config:
